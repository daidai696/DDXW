<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻详情</title>
    <style>
        body { font-family: sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; border-radius: 20px; padding: 30px; }
        .title { font-size: 26px; font-weight: 700; color: #2c3e50; }
        .content { color: #5a6672; line-height: 1.8; margin-top: 20px; }
        .impact { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 15px; padding: 20px; color: white; margin-top: 20px; }
        .related { margin-top: 30px; padding-top: 30px; border-top: 1px solid #eee; }
        .rel-item { padding: 12px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <button onclick="window.location.href='daily-news.html'">← 返回列表</button>
        <div class="card">
            <div id="title">加载中...</div>
            <div id="content"></div>
            <div class="impact">
                <h4>💡 新闻启示</h4>
                <p id="impact"></p>
            </div>
            <div class="related">
                <h4> 相关新闻</h4>
                <div id="related"></div>
            </div>
        </div>
    </div>
    <script>
        var newsData = {
            1: {title: '今日主角 | “敬二舅”刷屏：平凡之光，大有力量', source: '新华网', url: 'http://www.news.cn/comments/20220728/b8859a78ad1743aeba8fdeadff3651bb/c.html', cat: 'politics'},
            2: {title: '如何理解文化自信的这一根本性意义？', source: '新华网', url: 'http://www.xinhuanet.com/comments/20220604/1f747dd82f284b56849e5d5302d84f22/c.html', cat: 'politics'},
            3: {title: '新时代中国发展进步的成功之道', source: '新华网', url: 'http://www.news.cn/comments/20220507/633c2f34e0744bddac65f88387f168f8/c.html', cat: 'politics'},
            4: {title: '开局起步“十五五”系列主题新闻发布会', source: '新华网', url: 'https://www.news.cn/zt/swwxlztfbh/index.html', cat: 'politics'},
            5: {title: '“清清黄河”行进式报道', source: '新华网', url: 'https://www.news.cn/specials.html', cat: 'politics'},
            6: {title: '爱尔眼科大额补税', source: '新浪财经', url: 'https://finance.sina.com.cn/zt_d/subject-1779339744', cat: 'economy'},
            7: {title: '证监会严肃查处老虎富途长桥', source: '新浪财经', url: 'https://finance.sina.com.cn/zt_d/zjhyclhftcqffkjzyaj', cat: 'economy'},
            8: {title: '新浪财经APP', source: '新浪财经', url: 'javascript:;', cat: 'economy'},
            9: {title: '金麒麟研报', source: '新浪财经', url: 'https://finance.sina.com.cn/stock/reportch/jinqilin.shtml', cat: 'economy'},
            10: {title: 'RSS订阅', source: 'IT 之家', url: 'https://www.ithome.com//www.ithome.com/rss/', cat: 'tech'},
            11: {title: '收藏IT之家', source: 'IT 之家', url: '#', cat: 'tech'},
            12: {title: 'App客户端', source: 'IT 之家', url: 'https://www.ithome.com//m.ruanmei.com/', cat: 'tech'},
            13: {title: '要知App', source: 'IT 之家', url: 'https://www.ithome.com//yaozhi.ruanmei.com/', cat: 'tech'},
            14: {title: 'iPhone', source: 'IT 之家', url: 'https://www.ithome.com//iphone.ithome.com/', cat: 'tech'}
        };
        
        function getNewsId() {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('n') || params.get('news');
            return id ? parseInt(id) : 1;
        }
        
        function renderNews(id) {
            var news = newsData[id];
            if (!news) {
                document.getElementById('title').textContent = '新闻未找到';
                return;
            }
            document.getElementById('title').textContent = news.title;
            document.getElementById('content').innerHTML = '<p>来源：' + news.source + '</p><p><a href="' + news.url + '" target="_blank" style="color: #667eea;">查看原文</a></p>';
            document.getElementById('impact').textContent = '该新闻反映了当前' + news.cat + '领域的最新动态，值得持续关注。';
            
            var related = [];
            for (var key in newsData) {
                if (parseInt(key) !== id && newsData[key].cat === news.cat) {
                    related.push(key);
                }
            }
            related = related.slice(0, 3);
            var html = '';
            for (var i = 0; i < related.length; i++) {
                var k = related[i];
                html += '<div class="rel-item" onclick="window.location.href=\'news-detail.html?n=\' + k + \'\'">' + newsData[k].title + '</div>';
            }
            document.getElementById('related').innerHTML = html || '<p style="color: #95a5a6;">暂无相关新闻</p>';
        }
        
        renderNews(getNewsId());
    </script>
</body>
</html>
