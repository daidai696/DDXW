        function getNewsId() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('news');
            return id ? parseInt(id) : 1;
        }

        function renderNews(newsId) {
            const news = newsData[newsId];
            if (!news) {
                document.getElementById('news-title').textContent = '新闻未找到';
                return;
            }

            document.getElementById('news-title').textContent = news.title;
            document.getElementById('category-tag').textContent = news.category;
            document.getElementById('news-source').textContent = '📰 ' + news.source;
            document.getElementById('news-summary').textContent = news.summary;

            const detailsContainer = document.getElementById('news-details');
            detailsContainer.innerHTML = '';
            news.details.forEach(item => {
                const detailItem = document.createElement('div');
                detailItem.className = 'detail-item';
                detailItem.innerHTML = `<span class="detail-label">${item.label}</span><span class="detail-content">${item.content}</span>`;
                detailsContainer.appendChild(detailItem);
            });

            const relatedContainer = document.getElementById('related-news');
            relatedContainer.innerHTML = '';
            news.related.forEach(relatedId => {
                const relatedNews = newsData[relatedId];
                if (relatedNews) {
                    const li = document.createElement('li');
                    li.className = 'related-item';
                    li.onclick = () => window.location.href = `news-detail.html?news=${relatedId}`;
                    li.innerHTML = `<span class="related-icon">📌</span><span class="title">${relatedNews.title}</span>`;
                    relatedContainer.appendChild(li);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const newsId = getNewsId();
            renderNews(newsId);
        });
    </script>
